<!doctype html><html lang="en"><head><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Crect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%23087f7b%22/%3E%3Ctext x=%2250%22 y=%2267%22 text-anchor=%22middle%22 font-size=%2250%22 fill=%22white%22%3EV%3C/text%3E%3C/svg%3E"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Claims Signal Lab</title>
    <style>:root{color-scheme:light dark;--bg:#f3f6fa;--fg:#172a40;--card:white;--line:#d6e1ea;--accent:#087f7b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.6 system-ui,sans-serif}main{max-width:1000px;margin:60px auto;padding:28px}.eyebrow{color:var(--accent);font-size:13px;font-weight:800;letter-spacing:.18em}h1{font-size:clamp(32px,6vw,54px);line-height:1.1;margin:18px 0}p{max-width:700px}.panel{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:28px;margin-top:30px;box-shadow:0 10px 40px #1232}label{display:block;font-weight:700;margin-bottom:10px}textarea{width:100%;padding:16px;border:1px solid var(--line);border-radius:10px;font:inherit;color:var(--fg);background:var(--bg);resize:vertical}button{background:var(--accent);color:white;padding:12px 24px;border:0;border-radius:10px;font:inherit;margin-top:16px;cursor:pointer}button:disabled{opacity:.5}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:14px/1.6 ui-monospace,monospace}footer{font-size:13px;opacity:.75;margin-top:30px}a{color:var(--accent)}@media(prefers-color-scheme:dark){:root{--bg:#0c1420;--fg:#e1edf6;--card:#142132;--line:#2b4056;--accent:#3bb8ac}button{color:#0c1420}}.evidence{display:grid;gap:12px}.evidence article{border-left:3px solid var(--accent);padding:12px 16px;background:var(--bg);border-radius:0 10px 10px 0}.evidence h3{font-size:14px;margin:0 0 5px;color:var(--accent)}.evidence p{font-size:15px;margin:0;white-space:pre-line}.meta{font-size:12px;opacity:.7}</style></head>
    <body><main><div class="eyebrow">VASU MEKALA / APPLIED AI DEMO</div><h1>Claims Signal Lab</h1><p>Message routing, confidence and transparent entity spans. Synthetic data only.</p><section class="panel"><form id="form"><label for="input">Enter a member message</label><textarea id="input" rows="3" maxlength="1000" required>My invoice has a duplicate billing charge of 60 dollars for claim CLM-12345.</textarea><button id="run">Classify message</button></form><div aria-live="polite"><h2 id="result-title" hidden>Result</h2><p id="summary"></p><div id="details" class="evidence"></div></div></section><footer>Local demonstration · No employer or patient data · <a href="/docs">API documentation</a></footer></main>
    <script>const form=document.querySelector('#form'),button=document.querySelector('#run');form.addEventListener('submit',async e=>{e.preventDefault();button.disabled=true;document.querySelector('#summary').textContent='Analyzing…';try{const r=await fetch('/classify',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:document.querySelector('#input').value})});if(!r.ok)throw new Error('Request failed: '+r.status);const d=await r.json();document.querySelector('#result-title').hidden=false;document.querySelector('#summary').textContent=d.answer||('Route: '+d.label+' · Confidence: '+(d.confidence*100).toFixed(1)+'%'+(d.review_required?' · Human review required':''));const details=document.querySelector('#details');details.replaceChildren();for(const item of (d.sources||d.entities)){const card=document.createElement('article');const heading=document.createElement('h3');heading.textContent=item.id?('Source · '+item.id):item.type.replaceAll('_',' ');const content=document.createElement('p');content.textContent=item.text||item.value;card.append(heading,content);details.append(card)}if(d.notice){const note=document.createElement('p');note.className='meta';note.textContent=d.notice;details.append(note)}}catch(err){document.querySelector('#summary').textContent=err.message}finally{button.disabled=false}});</script></body></html>
